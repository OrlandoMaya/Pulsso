# Pulsso detrás del nginx que ya tiene el servidor (opción B, sin Caddy).
#
#   sudo cp deploy/nginx-pulsso.conf /etc/nginx/sites-available/pulsso
#   sudo ln -s /etc/nginx/sites-available/pulsso /etc/nginx/sites-enabled/pulsso
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d calendar.pulsso.online -d calendar-api.pulsso.online   # HTTPS
#
# Los otros sitios del servidor no se tocan: nginx elige el bloque por el dominio (server_name).

# App
server {
    listen 80;
    server_name calendar.pulsso.online;

    location / {
        proxy_pass http://127.0.0.1:4040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API
server {
    listen 80;
    server_name calendar-api.pulsso.online;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
