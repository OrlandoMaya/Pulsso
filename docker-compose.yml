# Uso:
#   cp backend/.env.example backend/.env   # MONGODB_URI de Atlas + JWT_SECRET
#   cp .env.example .env                   # dominios y correo para HTTPS
#   docker compose up -d --build
#   → https://calendar.pulsso.online (app) y https://calendar-api.pulsso.online (API)
services:
  # Entrada pública: HTTPS en 80/443 hacia la app y la API
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Falta WEB_DOMAIN en .env}
      API_DOMAIN: ${API_DOMAIN:?Falta API_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados: si se pierden, Caddy los pide de nuevo (con límite de Let's Encrypt)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      PORT: "4000"
      # Detrás de Caddy: la IP real del cliente viene en X-Forwarded-For (límite de intentos de login)
      TRUST_PROXY: "1"
      # La app llama a la API desde su propio dominio
      CORS_ORIGIN: https://${WEB_DOMAIN}
    # Sin puerto público: el mundo entra por Caddy. Desde el servidor: curl localhost:4000/api/health
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # La app se compila apuntando a la API pública
        VITE_API_URL: https://${API_DOMAIN}
    environment:
      API_UPSTREAM: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
