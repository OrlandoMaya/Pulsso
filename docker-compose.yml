# Uso:
#   cp backend/.env.example backend/.env   # MONGODB_URI de Atlas + JWT_SECRET
#   docker compose up --build
#   → http://localhost:4040
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      PORT: "4000"
      # Detrás de nginx: la IP real del cliente viene en X-Forwarded-For (límite de intentos de login)
      TRUST_PROXY: "1"
      CORS_ORIGIN: http://localhost:4040
    # Solo accesible desde el propio servidor (el público entra por el frontend en :4040)
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: http://backend:4000
    ports:
      - "4040:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
