# Uso:
#   cp backend/.env.example backend/.env   # MONGODB_URI de Atlas + JWT_SECRET
#   cp .env.example .env                   # dominios y correo para HTTPS
#   docker compose up -d --build
#   → https://calendar.pulsso.online (app) y https://calendar-api.pulsso.online (API)
services:
  # Entrada pública: HTTPS en 80/443 hacia la app y la API.
  # Solo arranca con el perfil "caddy" (COMPOSE_PROFILES=caddy en .env). Si el servidor ya tiene
  # un nginx en el 80, quita ese perfil y usa deploy/nginx-pulsso.conf en ese nginx.
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    ports:
      # BIND_IP: en un servidor con varias IP, escuchar solo en la de Pulsso
      - "${BIND_IP:-0.0.0.0}:80:80"
      - "${BIND_IP:-0.0.0.0}:443:443"
      - "${BIND_IP:-0.0.0.0}:443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Falta WEB_DOMAIN en .env}
      API_DOMAIN: ${API_DOMAIN:?Falta API_DOMAIN en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Falta ACME_EMAIL en .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados: si se pierden, Caddy los pide de nuevo (con límite de Let's Encrypt)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    environment:
      PORT: "4000"
      # Detrás de Caddy o nginx: la IP real del cliente viene en X-Forwarded-For (límite de intentos de login)
      TRUST_PROXY: "1"
      # La web llama a la API desde su propio dominio; la app de Android (Capacitor), desde https://localhost
      CORS_ORIGIN: https://${WEB_DOMAIN},https://localhost
      # Enlaces de los correos de recuperación de contraseña
      APP_URL: https://${WEB_DOMAIN}
    # Sin puerto público: el mundo entra por Caddy o nginx. Desde el servidor: curl localhost:4000/api/health
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # La app se compila apuntando a la API pública
        VITE_API_URL: https://${API_DOMAIN}
    environment:
      API_UPSTREAM: http://backend:4000
    # Para un nginx del servidor (sin Caddy): solo desde el propio servidor
    ports:
      - "127.0.0.1:4040:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
